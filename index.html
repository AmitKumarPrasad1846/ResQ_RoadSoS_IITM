<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ResQ — Every Second Counts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Potta+One&family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    /* RESET - NO SCROLL */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* NO SCROLL - STATIC PAGE */
      font-family: 'Poppins', sans-serif;
    }

    /* MAIN CONTAINER - FULL SCREEN FIXED */
    .landing {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 60px 40px 80px;
      text-align: center;
      overflow: hidden;
    }

    /* BACKGROUND IMAGE */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
    }

    /* DARK OVERLAY */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom,
          rgba(5, 10, 25, 0.7) 0%,
          rgba(5, 10, 25, 0.5) 50%,
          rgba(5, 10, 25, 0.7) 100%);
      z-index: 1;
    }

    /* ALL CONTENT */
    .top,
    .middle,
    .bottom {
      position: relative;
      z-index: 2;
      width: 100%;
    }

    /* ========== TOP SECTION ========== */
    .top {
      animation: fadeDown 0.8s ease both;
      animation-delay: 0.1s;
    }

    .logo-wordmark {
      font-family: 'Potta One', cursive;
      font-size: 120px;
      line-height: 1;
      letter-spacing: -2px;
      color: #FFFFFF;
      text-shadow: 0 0 30px rgba(249, 4, 4, 0.5);
      margin-bottom: 15px;
    }

    .logo-wordmark span {
      color: #F90404;
    }

    .tagline {
      font-size: 24px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.95);
      letter-spacing: 2px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 18px;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.85);
      max-width: 700px;
      margin: 0 auto;
      line-height: 1.6;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
    }

    /* ========== MIDDLE SECTION - BIGGER LOGO ========== */
    .middle {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      animation: fadeUp 0.9s ease both;
      animation-delay: 0.3s;
    }

    .shield-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Glowing effect behind logo */
    .shield-wrap::before {
      content: '';
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(224, 48, 48, 0.3) 0%, transparent 70%);
      filter: blur(30px);
      animation: pulse-glow 3s ease-in-out infinite;
    }

    .shield-img {
      width: 380px;
      height: auto;
      position: relative;
      filter: drop-shadow(0 0 40px rgba(224, 48, 48, 0.5)) drop-shadow(0 0 80px rgba(30, 80, 180, 0.3));
      animation: float 4s ease-in-out infinite;
    }

    /* ========== BOTTOM SECTION ========== */
    .bottom {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
      animation: fadeUp 1s ease both;
      animation-delay: 0.55s;
    }

    .btn-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.95);
      color: #1a1a2e;
      padding: 14px 42px;
      border-radius: 60px;
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      min-width: 180px;
    }

    .btn-pill:hover {
      background: #FFFFFF;
      transform: translateY(-3px);
      box-shadow: 0 8px 35px rgba(0, 0, 0, 0.35);
    }

    .btn-pill:active {
      transform: translateY(1px);
    }

    .btn-pill .play-icon {
      font-size: 12px;
      font-weight: bold;
    }

    /* ========== ANIMATIONS ========== */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-15px);
      }
    }

    @keyframes pulse-glow {

      0%,
      100% {
        opacity: 0.5;
        transform: scale(1);
      }

      50% {
        opacity: 0.8;
        transform: scale(1.1);
      }
    }

    /* ========== RESPONSIVE DESIGN ========== */

    /* Laptop Screens */
    @media (max-width: 1366px) {
      .logo-wordmark {
        font-size: 100px;
      }

      .shield-img {
        width: 320px;
      }

      .shield-wrap::before {
        width: 380px;
        height: 380px;
      }
    }

    /* Tablet Screens */
    @media (max-width: 1024px) {
      .landing {
        padding: 50px 30px 60px;
      }

      .logo-wordmark {
        font-size: 85px;
      }

      .tagline {
        font-size: 20px;
      }

      .subtitle {
        font-size: 16px;
        max-width: 80%;
      }

      .shield-img {
        width: 280px;
      }

      .shield-wrap::before {
        width: 330px;
        height: 330px;
      }
    }

    /* Mobile Screens */
    @media (max-width: 768px) {
      .landing {
        padding: 40px 20px 50px;
      }

      .logo-wordmark {
        font-size: 65px;
      }

      .tagline {
        font-size: 18px;
      }

      .subtitle {
        font-size: 14px;
        max-width: 90%;
      }

      .shield-img {
        width: 220px;
      }

      .shield-wrap::before {
        width: 260px;
        height: 260px;
      }

      .btn-pill {
        padding: 12px 30px;
        font-size: 14px;
        min-width: 160px;
      }

      .bottom {
        gap: 15px;
      }
    }

    /* Small Mobile */
    @media (max-width: 480px) {
      .landing {
        padding: 30px 16px 40px;
      }

      .logo-wordmark {
        font-size: 52px;
      }

      .tagline {
        font-size: 16px;
      }

      .subtitle {
        font-size: 12px;
        line-height: 1.5;
      }

      .shield-img {
        width: 180px;
      }

      .shield-wrap::before {
        width: 210px;
        height: 210px;
      }

      .bottom {
        flex-direction: column;
        gap: 12px;
      }

      .btn-pill {
        width: 100%;
        max-width: 250px;
        padding: 11px 20px;
      }
    }

    /* For very tall screens */
    @media (min-height: 900px) {
      .logo-wordmark {
        font-size: 130px;
      }

      .shield-img {
        width: 420px;
      }

      .shield-wrap::before {
        width: 500px;
        height: 500px;
      }
    }
  </style>
</head>

<body>

  <div class="landing">

    <!-- BACKGROUND IMAGE - File name: background-1.png -->
    <img src="assets/bcakground-1.png" alt="Background" class="bg-image"
      onerror="console.error('Background image not found at: assets/background-1.png'); this.style.display='none'; document.body.style.background='#0a0a1f';" />
    <div class="overlay"></div>

    <!-- TOP SECTION - Logo and Text -->
    <div class="top">
      <div class="logo-wordmark">Res<span>Q</span></div>
      <p class="tagline">Every second counts</p>
      <p class="subtitle">
        Smart accident detection and instant emergency response system<br>
        designed to save lives on the road.
      </p>
    </div>

    <!-- MIDDLE SECTION - Shield Logo -->
    <div class="middle">
      <div class="shield-wrap">
        <img src="assets/ResQ-transparent-1.png" alt="ResQ Shield" class="shield-img"
          onerror="console.error('Shield logo not found at: assets/ResQ-transparent-1.png'); this.style.display='none';" />
      </div>
    </div>

    <!-- BOTTOM SECTION - Action Buttons -->
    <div class="bottom">
      <a href="home.html" class="btn-pill">Go to Home</a>
      <a href="#" class="btn-pill" onclick="showDemoMessage(); return false;">
        <span class="play-icon">▶</span>
        Watch Demo
      </a>
      <a href="features.html" class="btn-pill">Explore Features</a>
    </div>

  </div>

  <script>
    // Demo message function - clean text
    function showDemoMessage() {
      alert("Demo video coming soon.\n\nResQ - Smart accident detection and emergency response system.");
    }

    // Check if images loaded properly
    window.addEventListener('load', function () {
      console.log('ResQ Landing Page Loaded');
      console.log('Page is static - no scrolling');

      const bgImg = document.querySelector('.bg-image');
      if (bgImg && bgImg.complete && bgImg.naturalWidth === 0) {
        console.error('Background image missing. Make sure "assets/background-1.png" exists');
      }

      const shieldImg = document.querySelector('.shield-img');
      if (shieldImg && shieldImg.complete && shieldImg.naturalWidth === 0) {
        console.error('Shield logo missing. Make sure "assets/ResQ-transparent-1.png" exists');
      }
    });
  </script>

</body>

</html>
